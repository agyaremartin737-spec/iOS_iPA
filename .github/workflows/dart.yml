name: Build Non-JIT Playable Vita3K iOS App

on:
  workflow_dispatch:

jobs:
  build_ios:
    name: Native Xcode iOS Compile
    runs-on: macos-14

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          repository: 'vion-app-org/Vion'
          ref: 'native-ios-port'
          submodules: recursive

      - name: Configure CMake for Apple Xcode
        run: |
          cmake -B build_ios \
            -G "Xcode" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CODE_SIGNING=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_CXX_FLAGS="-O3 -flto -DNDEBUG" \
            -DCMAKE_C_FLAGS="-O3 -flto -DNDEBUG"

      - name: Execute Xcode Build Compilation
        run: |
          cmake --build build_ios --config Release -- -sdk iphoneos

      - name: Construct Unsigned Extension Package
        run: |
          mkdir -p build_ios/ipa/Payload
          cp -r build_ios/Release-iphoneos/Vion.app build_ios/ipa/Payload/ 2>/dev/null || cp -r build_ios/bin/Release-iphoneos/Vion.app build_ios/ipa/Payload/ || cp -r build_ios/Vion.app build_ios/ipa/Payload/
          cd build_ios/ipa
          zip -9 -r ../../Vion_Vita3K_NoJIT_Interpreter.ipa Payload
          cd ../..

      - name: Export Executable Asset
        uses: actions/upload-artifact@v4
        with:
          name: Non-JIT-Vita3K-IPA
          path: Vion_Vita3K_NoJIT_Interpreter.ipa
